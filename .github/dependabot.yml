# Dependabot — security updates + weekly freshness for npm and github-actions.
# The conventional-commit prefix keeps Dependabot's PR subjects passing the
# commit-message gate on the PR range.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
